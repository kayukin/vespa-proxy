version: "3.9"

services:
  vespa-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VESPA_VERSION: master
    image: vespa-proxy:latest
    ports:
      - "8080:8080"
    volumes:
      # Mount your mTLS certificate files (referenced in config.yaml)
      - ./certs:/certs:ro
      # Mount the config file into the container
      - ./config.yaml:/config.yaml:ro
    command: ["-config", "/config.yaml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
